id: login_events
name: Login Events
description: Publishes session.login_started from the internal 1.8.9 login primitive.
packageType: event-pack
api: ">=1.0.0 <2.0.0"
entry: bin/main.dart
profiles:
  - AyuMC-1.8.9-release
capabilities:
  - observe
  - publish
provides:
  - id: session.login_started
    version: 1.0.0
    description: A client sent a login-start packet. This is not a completed join.
    sources:
      - core.session.login
    schema:
      name: string
      protocol: int
