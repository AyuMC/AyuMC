version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.5

dependencies:
  ayu_core:
    path: ../ayu_core
  ayu_ipc:
    path: ../ayu_ipc
  ayu_logging:
    path: ../ayu_logging
  ayu_package:
