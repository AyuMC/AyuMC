name: ayumc
description: AyuMC server - a Dart Minecraft server platform with process-isolated plugins.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.5

dependencies:
  ayu_commands:
    path: packages/ayu_commands
  ayu_core:
    path: packages/ayu_core
  ayu_events:
    path: packages/ayu_events
  ayu_logging:
    path: packages/ayu_logging
  ayu_runtime:
    path: packages/ayu_runtime

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
