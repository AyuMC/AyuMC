id: session_audit
name: Session Audit
description: Logs one line when a play session starts and one line when it ends.
api: ">=1.0.0 <2.0.0"
entry: bin/main.dart
capabilities:
  - events
events:
  requires:
    - id: session.joined
      version: "^1.0.0"
    - id: session.left
      version: "^1.0.0"
